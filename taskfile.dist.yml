version: '3'

tasks:
  install:
    desc: Install dependencies
    cmds:
      - bun install {{.CLI_ARGS}}

  dev:
    desc: Start development server
    cmds:
      - bun run dev {{.CLI_ARGS}}

  build:
    desc: Build project
    cmds:
      - bun run build {{.CLI_ARGS}}

  lint:
    desc: Check lint and format (no fix)
    cmds:
      - bun run lint
      - bun run fmt
      - bun run fmt:json
      - bun run fmt:css

  lint-fix:
    desc: Lint and format (fix)
    cmds:
      - bun run lint:fix
      - bun run fmt:fix
      - bun run fmt:json:fix
      - bun run fmt:css:fix

  test:
    desc: Run tests
    cmds:
      - bun run test {{.CLI_ARGS}}

  tscheck:
    desc: TypeScript type check
    cmds:
      - bunx tsc --noEmit

  clean:
    desc: Clean build artifacts and dependencies
    prompt: Are you sure you want to clean?
    cmds:
      - rm -rf node_modules
      - rm -rf dist

  doctor:
    desc: Run the strict full React Doctor gate
    cmds:
      - bun run doctor
