version: '3'

tasks:
  install:
    desc: Install dependencies
    cmds:
      - bun install {{.CLI_ARGS}}

  dev:
    desc: Start development server
    cmds:
      - bun run dev {{.CLI_ARGS}}

  build:
    desc: Build project
    cmds:
      - bun run build {{.CLI_ARGS}}

  preview:
    desc: Preview production build
    cmds:
      - bun run preview {{.CLI_ARGS}}

  lint:
    desc: Check lint (no fix)
    cmds:
      - bun run lint
      - bun run lint:prettier-check

  lint-fix:
    desc: Lint and format code
    cmds:
      - bun run lint:fix
      - bun run lint:prettier-fix

  test:
    desc: Run tests
    cmds:
      - bun run test {{.CLI_ARGS}}

  tscheck:
    desc: TypeScript type check
    cmds:
      - bunx tsc --noEmit

  clean:
    desc: Clean build artifacts and dependencies
    prompt: Are you sure you want to clean?
    cmds:
      - rm -rf node_modules
      - rm -rf .output

  doctor:
    desc: Run react-doctor
    cmds:
      - bunx -y react-doctor@latest .
