name: PR Checks

on:
  pull_request:
    branches: [master, develop]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, Type Check, Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run fmt

      - name: Check json format
        run: bun run fmt:json

      - name: Check css format
        run: bun run fmt:css

      - name: TypeScript
        run: bun run tscheck

      - name: Tests
        run: bun run test

      - name: Build SPA
        run: bun run build

      - name: Check SPA client chunks
        run: bun run check:bundle

      - name: Verify Pages SPA output
        run: |
          test -s dist/client/index.html
          test ! -e dist/client/404.html

      - name: Build SSR
        run: bun run build:ssr

      - name: Check SSR client chunks
        run: bun run check:bundle

      - name: React Doctor review
        uses: millionco/react-doctor@v2
        with:
          blocking: warning
          scope: full

      - name: React Doctor strict gate
        run: bun run doctor
