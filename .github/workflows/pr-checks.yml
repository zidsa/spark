name: PR Checks

on:
  pull_request:
    branches: [master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, Type Check, Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bun run lint:eslint

      - name: Prettier
        run: bun run lint:prettier-check

      - name: TypeScript
        run: bun run tscheck

      - name: Tests
        run: bun run test

      - name: React Doctor
        run: bunx -y react-doctor@latest .
