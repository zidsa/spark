name: Workflow Listener

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  code-review:
    name: Code review
    if: >-
      github.event.repository.private == true &&
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/code-review') &&
      (
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'OWNER'
      )
    permissions:
      contents: read
      pull-requests: write
    uses: zidsa/.github/.github/workflows/code-review.yml@master
    secrets:
      CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
      WORKFLOWS_READ_TOKEN: ${{ secrets.WORKFLOWS_READ_TOKEN }}
      JIRA_API_KEY: ${{ secrets.JIRA_API_KEY }}
      HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
      JAM_ACCESS_TOKEN: ${{ secrets.JAM_ACCESS_TOKEN }}
      FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
